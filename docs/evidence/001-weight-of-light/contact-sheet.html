<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebArt 001 production contact sheet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #111; color: #eee; font: 12px/1.4 Arial, sans-serif; }
      h1, h2 { margin: 0 0 16px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
      h2 { margin-top: 32px; color: #b5a58f; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      figure { margin: 0; border: 1px solid #333; background: #080808; }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 8px 10px; color: #aaa; letter-spacing: .06em; text-transform: uppercase; }
      .transitions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    </style>
  </head>
  <body>
    <h1>Design 001 — production baseline</h1>

    <h2>Mother reference evidence</h2>
    <div class="grid">
      <figure><img src="reference-cover.png" alt="Mother reference cover" /><figcaption>Reference / cover</figcaption></figure>
      <figure><img src="reference-chapter-01.png" alt="Mother reference chapter one" /><figcaption>Reference / chapter 01</figcaption></figure>
      <figure><img src="reference-chapter-03.png" alt="Mother reference chapter three" /><figcaption>Reference / material climax</figcaption></figure>
      <figure><img src="reference-ending.png" alt="Mother reference ending" /><figcaption>Reference / ending</figcaption></figure>
    </div>

    <h2>Accepted principal states — 2048 × 912</h2>
    <div class="grid">
      <figure><img src="local-01-encounter.png" alt="Encounter" /><figcaption>01 / Encounter</figcaption></figure>
      <figure><img src="local-02-threshold.png" alt="Threshold" /><figcaption>02 / Threshold</figcaption></figure>
      <figure><img src="local-03-passage.png" alt="Passage" /><figcaption>03 / Passage</figcaption></figure>
      <figure><img src="local-04-coda.png" alt="Coda" /><figcaption>04 / Coda</figcaption></figure>
    </div>

    <h2>Transition midpoints — 2048 × 912</h2>
    <div class="grid transitions">
      <figure><img src="local-t1-midpoint.png" alt="Transition one midpoint" /><figcaption>T1 / midpoint</figcaption></figure>
      <figure><img src="local-t2-midpoint.png" alt="Transition two midpoint" /><figcaption>T2 / midpoint</figcaption></figure>
      <figure><img src="local-t3-midpoint.png" alt="Transition three midpoint" /><figcaption>T3 / midpoint</figcaption></figure>
    </div>
  </body>
</html>
